steps:
  - name: gcr.io/cloud-builders/docker
    id: Pull staging cache
    entrypoint: bash
    args:
      - -c
      - docker pull europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging:latest || true
  - name: gcr.io/cloud-builders/docker
    id: Build staging image
    args:
      - build
      - --cache-from=europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging:latest
      - --build-arg=VITE_FIREBASE_PROJECT_ID=olmart-staging-e2e
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=olmart-staging-e2e.firebaseapp.com
      - --build-arg=VITE_FIREBASE_API_KEY=AIzaSyDQ7fnlHrf-8Lnqi7RGDwk1yZYez-vLNwg
      - --build-arg=VITE_FIREBASE_APP_ID=1:207154734313:web:9d1c454106ccc56593fc78
      - --build-arg=VITE_FIREBASE_STORAGE_BUCKET=olmart-staging-e2e.firebasestorage.app
      - --build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=207154734313
      - --build-arg=VITE_FIREBASE_DATABASE_ID=(default)
      - --build-arg=FIREBASE_DATABASE_ID=(default)
      - -t
      - europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging:$COMMIT_SHA
      - -t
      - europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging:latest
      - .
      - -f
      - Dockerfile
  - name: gcr.io/cloud-builders/docker
    id: Push staging image
    args:
      - push
      - --all-tags
      - europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy staging to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - olmart-staging
      - --project=olmart-staging-e2e
      - --region=europe-west2
      - --image=europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging:$COMMIT_SHA
      - --update-secrets=CSRF_SECRET=CSRF_SECRET:latest
      - --update-env-vars=DEPLOYED_COMMIT_SHA=$COMMIT_SHA
      - --quiet
images:
  - europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging:$COMMIT_SHA
  - europe-west2-docker.pkg.dev/olmart-staging-e2e/cloud-run-source-deploy/olmart-staging:latest
options:
  logging: CLOUD_LOGGING_ONLY
